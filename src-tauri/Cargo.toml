[package]
name = "chute"
version = "0.2.3"
description = "Chute desktop app"
authors = ["Chute"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-http = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-store = "2"
open = "5"
tauri-plugin-single-instance = "2.4.2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# Voice capture: on-device speech-to-text (whisper.cpp) + mic capture.
# Metal accel is added as a perf pass once the CPU path works end-to-end.
cpal = "0.18"
whisper-rs = "0.16"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "blocking"] }

[target.'cfg(target_os = "macos")'.dependencies]
# Needed to trigger the real Microphone TCC prompt (cpal alone stays silent).
objc2 = "0.6"
objc2-foundation = "0.3"
block2 = "0.6"
# Landed notch panel (level, notch geometry, pointer polling) and the capture
# bar as a non-activating NSPanel.
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSEvent", "NSGraphics", "NSPanel", "NSResponder", "NSScreen", "NSWindow"] }
